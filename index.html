<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fu-koro｜無料で使える麻雀ツール</title>
  <meta name="description" content="麻雀の点数計算など、スマホでそのまま使える無料ツールの一覧。">
  <meta name="theme-color" content="#1b5e43">
  <style>
    :root {
      --paper: #edf2ee; --surface: #ffffff; --ink: #1d2a3a; --ink-soft: #52606d; --line: #cfd9d2;
      --felt: #1b5e43; --felt-ink: #e8f3ec; --focus: #dfa637;
      --font-ui: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); line-height: 1.7; }
    header { background: var(--felt); color: var(--felt-ink); padding: 32px 16px 28px; }
    header h1 { margin: 0 auto; max-width: 640px; font-size: 1.75rem; letter-spacing: 0.02em; }
    header p { margin: 4px auto 0; max-width: 640px; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.app { display: block; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--felt);
      border-radius: 10px; padding: 16px; color: inherit; text-decoration: none; min-height: 44px; }
    a.app:hover { border-color: var(--felt); }
    a.app:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    a.app strong { display: block; font-size: 1.15rem; color: var(--felt); }
    a.app span { color: var(--ink-soft); }
  </style>
</head>
<body>
  <header>
    <h1>fu-koro</h1>
    <p>麻雀卓の横で、スマホですぐ使える無料ツール。</p>
  </header>
  <main>
    <ul>
      <li>
        <a class="app" href="/mahjong-fu-calculator/">
          <strong>麻雀 点数計算</strong>
          <span>あがった牌をタップするだけで、点数・役・符を自動で計算します。</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
